name: Update NHC KML

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate KML
        run: python update_kml.py

      - name: Commit updated KML
        run: |
          git config user.name "NHC KML Bot"
          git config user.email "actions@github.com"
          git add nhc_atlantic.kml
          git diff --cached --quiet || git commit -m "Update NHC outlook"
          git push
